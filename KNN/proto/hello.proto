syntax = "proto3";

package hello;

option go_package = "github.com/viratgarg/grpc-demo/proto";

service Greeter {
  rpc SayHello (HelloRequest) returns (HelloResponse);
  rpc Add (AddRequest) returns (AddResponse);
  rpc ProcessBatch (VectorBatch) returns (VectorBatch);
  rpc StoreBatch (VectorBatch) returns (StoreResponse);
  rpc NormalizeStored (Empty) returns (VectorBatch);
  rpc KNN (KNNRequest) returns (KNNResponse);
}

message HelloRequest {
  string name = 1;
}

message HelloResponse {
  string message = 1;
}

message AddRequest {
  float a = 1;
  float b = 2;
}

message AddResponse {
  float result = 1;
}

message Vector {
  repeated float values = 1;
}
message VectorBatch {
  repeated Vector vectors = 1;
}
message StoreResponse {
  string message = 1;
}

message Empty {}
message VectorRequest {
  Vector vector = 1;
}
message VectorResponse {
  Vector vector = 1;
}

message KNNRequest {
   Vector query = 1;
   int32 k = 2;
}

message KNNResponse {
   repeated Vector neighbors = 1;
   repeated double distances = 2;
}
